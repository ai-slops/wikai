schemaVersion: 1
vault:
  root: ../private-vault
publisher:
  stateDir: ../private-vault/.publisher
  previewStagingDir: ../build/preview-staging
  releaseStagingDir: ../build/release-staging
  cleanBuild: true
publicViews:
  roots: [public-views]
assets:
  roots: [assets, public-assets]
  maxFileBytes: 52428800
  rejectSymlinks: true
  stripImageMetadata: true
  reviewedHashes: []
security:
  denyPatterns: ["PRIVATE_SENTINEL_[A-Z0-9_]+"]
  warnPrivateTitles: true
  scanPii: true
  scanHighEntropy: true
review:
  warnAfterDays:
    work: 180
    knowledge: 180
    log: 0
    page: 365
site:
  sourceDir: ./site
  distDir: ../build/public-dist
  url: https://example.invalid
  isolatedBuild: true
  network: disabled
  image: wikai-site:local
deployments:
  local:
    type: directory
    root: ../deployments/local
